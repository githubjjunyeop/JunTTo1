<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>준또 | 자동 로또 추첨기</title>
<style>
:root{color-scheme:dark;font-family:system-ui,'Malgun Gothic',sans-serif}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(ellipse at top,#263a68,#0b1021 65%);color:#fff;display:grid;place-items:center;padding:24px}.app{width:min(700px,100%);background:#ffffff0d;border:1px solid #ffffff25;border-radius:28px;padding:clamp(20px,5vw,42px);box-shadow:0 20px 60px #0006;text-align:center}h1{font-size:clamp(28px,6vw,43px);margin:10px 0}p{color:#c4cee2}.machine{margin:25px auto;width:min(270px,75vw);aspect-ratio:1;border:8px solid #b7c6e8;border-radius:50%;background:radial-gradient(circle at 30% 20%,#ffffff3d,#3b579a33 45%,#111b36);position:relative;overflow:hidden;box-shadow:inset 0 0 32px #b8c7fa44,0 0 30px #688cfa22}.mini{position:absolute;width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-weight:800;font-size:13px;box-shadow:inset -3px -4px 6px #0003}.mixing .mini{animation:shake .25s ease-in-out infinite alternate}.mini:nth-child(2n){animation-delay:-.12s}@keyframes shake{to{transform:translate(17px,-12px) rotate(70deg)}}button{border:0;background:linear-gradient(120deg,#ffd36b,#f39b33);color:#172038;border-radius:16px;padding:16px 34px;font-weight:900;font-size:18px;cursor:pointer;width:min(320px,100%)}button:disabled{opacity:.6;cursor:wait}.results{display:grid;gap:12px;margin-top:25px}.game{display:flex;align-items:center;justify-content:center;gap:12px;background:#ffffff0d;padding:12px;border-radius:14px;flex-wrap:wrap}.game label{font-weight:700;color:#d2defa;min-width:55px}.balls{display:flex;justify-content:center;gap:6px;flex-wrap:wrap}.ball{width:clamp(34px,7vw,46px);height:clamp(34px,7vw,46px);border-radius:50%;display:grid;place-items:center;font-weight:800;box-shadow:inset -4px -5px 8px #0003,0 3px 10px #0004}.yellow{background:#f4bf32;color:#202331}.blue{background:#398de5}.red{background:#e65b60}.gray{background:#818c9c}.green{background:#45ac75}.foot{font-size:12px;margin-top:20px}
</style></head>
<body><main class="app"><div>✦ JUN TTO 6/45 ✦</div><h1>★ 자동 준또 번호 ★</h1><p>공 45개를 섞고 한 개씩 꺼내는 자동 추첨</p><div class="machine" id="machine" aria-label="로또 공 추첨기"></div><button id="draw" type="button">🎱 로또 5게임 추첨하기</button><div class="results" id="results" aria-live="polite"></div><p class="foot">오락용 무작위 번호 생성기 · 실제 당첨번호를 예측하지 않습니다.</p></main>
<script>
const machine=document.querySelector('#machine');const button=document.querySelector('#draw');const results=document.querySelector('#results');
const color=n=>n<=10?'yellow':n<=20?'blue':n<=30?'red':n<=40?'gray':'green';
function randomIndex(max){const limit=Math.floor(4294967296/max)*max;const buf=new Uint32Array(1);let x;do{crypto.getRandomValues(buf);x=buf[0]}while(x>=limit);return x%max;}
function mix(balls){for(let i=balls.length-1;i>0;i--){const j=randomIndex(i+1);[balls[i],balls[j]]=[balls[j],balls[i]];}}
function drawOneGame(){const balls=Array.from({length:45},(_,i)=>i+1),chosen=[];for(let i=0;i<6;i++){mix(balls);chosen.push(balls.splice(Math.floor(balls.length/2),1)[0]);}return chosen.sort((a,b)=>a-b);}
function createBall(n){const el=document.createElement('span');el.className='ball '+color(n);el.textContent=String(n).padStart(2,'0');return el;}
function sleep(ms){return new Promise(resolve=>setTimeout(resolve,ms));}
function displayMachine(){machine.replaceChildren();const nums=Array.from({length:45},(_,i)=>i+1);mix(nums);for(let i=0;i<22;i++){const el=document.createElement('span');el.className='mini '+color(nums[i]);el.textContent=nums[i];const angle=i*2.39996;const radius=Math.sqrt((i+.5)/22)*39;el.style.left=`calc(${50+Math.cos(angle)*radius}% - 17px)`;el.style.top=`calc(${50+Math.sin(angle)*radius}% - 17px)`;machine.append(el);}}
button.addEventListener('click',async()=>{button.disabled=true;results.replaceChildren();machine.classList.add('mixing');button.textContent='추첨 중...';try{for(let game=1;game<=5;game++){await sleep(500);const numbers=drawOneGame();const row=document.createElement('div');row.className='game';const label=document.createElement('label');label.textContent=`${game}게임`;const holder=document.createElement('div');holder.className='balls';row.append(label,holder);results.append(row);for(const n of numbers){holder.append(createBall(n));await sleep(115);}}}finally{machine.classList.remove('mixing');button.textContent='🎱 다시 추첨하기';button.disabled=false;}});
displayMachine();
</script></body></html>
